name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release version and run tests
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $expectedTag = 'v' + $props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match $expectedTag."
          }
          dotnet test PreySense.slnx -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Release tests failed.' }

      - name: Publish
        shell: pwsh
        run: ./.github/publish.ps1

      - name: Read tag message
        id: notes
        shell: pwsh
        run: |
          $message = git tag -l --format="%(contents)" "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($message)) {
            $message = git log -1 --format="%b"
          }
          Set-Content -Path release_notes.txt -Value $message.Trim()

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PreySense.exe
          body_path: release_notes.txt
